name : nodejs-github-actions-ci-cd
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: nodejs-github-actions-cicd
  NODE_VERSION: 20

jobs:
  test:
   runs-on: ubuntu-latest

   steps:
    - name: checkout code 
      uses: actions/checkout@v4

    - name: setup Node js 
      uses: actions/setup-node@v4
      with:
        node-version: 20 
    
    - name: install dependencies
      run: npm ci 
    
    - name: Run tests
      run: npm test  

  docker:
    needs: test
    runs-on: ubuntu-latest
  
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to Docker Hub 
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{secrets.DOCKER_PASSWORD }}

      - name: Genearate Docker image tags 
        run: |
          echo " IMAGE_TAG=${{ github.run_number}}" >> $GITHUB_ENV
      
      - name: Build Dcoker Image
        run: |
          docker build \
            -t ${{vars.DOCKER_USERNAME}}/${{ env.IMAGE_NAME}}:${{env.IMAGE_TAG}} \
            -t ${{vars.DOCKER_USERNAME}}/${{ env.IMAGE_NAME}}:latest \
            .
      - name: push docker image
        run: |
          docker push ${{vars.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
          docker push ${{vars.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest

            